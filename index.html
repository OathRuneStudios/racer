<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Racer — Versions</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef1f8;
      --muted: #9ba4bd;
      --navy: #0b1020;
      --panel: rgba(16, 23, 44, 0.85);
      --border: rgba(170, 180, 213, 0.18);
      --yellow: #ffc531;
      --blue: #3b8bff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #151e3d 0%, var(--navy) 70%);
      color: var(--ink);
      font-family: Geist, system-ui, -apple-system, sans-serif;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: 6px;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .version-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .version-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(11, 16, 32, 0.65);
      color: var(--ink);
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .version-link:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      background: rgba(59, 139, 255, 0.12);
    }

    .version-title {
      font-weight: 600;
      font-size: 15px;
    }

    .file-tag {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .badge-latest {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--navy);
      background: var(--yellow);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Build Directory</div>
    <h1>Night Racer</h1>
    <p>Select a version below to launch the build.</p>

    <ul class="version-list">
      <li>
        <a class="version-link" href="v2.html"> <span class="badge-latest">Latest</span>
          
          <span class="version-title">Version 2</span>
          <span class="file-tag">v2.html</span>
        </a>
      </li>
      <li>
        <a class="version-link" href="v1.html">
          
          <span class="version-title">Version 1</span>
          <span class="file-tag">v1.html</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
